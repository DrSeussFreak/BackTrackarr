<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">BackTrackarr</title>
  <desc id="d">A rewind button inside a backward arrow, surrounded by icons for media, TV, movies, music, comics, books, audiobooks and games.</desc>
  <rect width="512" height="512" rx="112" fill="#17171a"/>

  <!-- Rewind + backward ring -->
  <g transform="translate(256 256)">
    <path d="M78.4-93.5A122 122 0 1 0 121.5-10.6" fill="none" stroke="#fb923c" stroke-width="13" stroke-linecap="round"/>
    <path d="M122-40 146-5H98z" fill="#fb923c" stroke="#fb923c" stroke-width="5" stroke-linejoin="round"/>
    <circle r="92" fill="#f97316"/>
    <g fill="#17171a" stroke="#17171a" stroke-width="9" stroke-linejoin="round">
      <path d="M0-36-50 0 0 36z"/>
      <path d="M52-36 2 0 52 36z"/>
    </g>
  </g>

  <g fill="none" stroke="#f7f1e8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- TV -->
    <g transform="translate(256 62)">
      <rect x="-27" y="-15" width="54" height="36" rx="6"/>
      <path d="M-10-30 0-15 10-30M-13 28H13"/>
    </g>
    <!-- Movies: clapperboard -->
    <g transform="translate(390 122)">
      <rect x="-26" y="-5" width="52" height="31" rx="4"/>
      <path d="M-26-5-30-17 21-30 26-17-26-5M-14-20-8-8M6-24 12-12"/>
    </g>
    <!-- Music -->
    <g transform="translate(450 256)">
      <path d="M-11 18V-20L20-27V11"/>
      <circle cx="-19" cy="18" r="8" fill="#f7f1e8"/>
      <circle cx="12" cy="11" r="8" fill="#f7f1e8"/>
    </g>
    <!-- Comics: action burst -->
    <g transform="translate(390 390)">
      <path fill="#f7f1e8" stroke-width="3" d="M0-31 8-18 22-23 18-9 32 0 18 8 22 23 8 18 0 31-8 18-22 23-18 8-32 0-18-9-22-23-8-18z"/>
      <path fill="#17171a" stroke="#17171a" stroke-width="2" d="M4-17-9 3H-1L-4 17 9-3H1z"/>
    </g>
    <!-- Books -->
    <g transform="translate(256 450)">
      <path d="M0-16C-8-24-20-24-30-20V20C-20 16-8 16 0 24 8 16 20 16 30 20V-20C20-24 8-24 0-16zM0-16V24"/>
    </g>
    <!-- Audiobooks: headphones around a small book -->
    <g transform="translate(122 390)">
      <path d="M-25 10V1A25 25 0 0 1 25 1V10"/>
      <rect x="-31" y="7" width="12" height="21" rx="5" fill="#f7f1e8"/>
      <rect x="19" y="7" width="12" height="21" rx="5" fill="#f7f1e8"/>
      <path stroke-width="3.5" d="M0 4C-3 1-9 1-12 3V21C-9 19-3 19 0 22 3 19 9 19 12 21V3C9 1 3 1 0 4zM0 4V22"/>
    </g>
    <!-- Games: controller -->
    <g transform="translate(62 256)">
      <path fill="#f7f1e8" stroke-width="3" d="M-18-16H18C26-16 31-8 32 5 33 18 25 23 18 16L11 9H-11L-18 16C-25 23-33 18-32 5-31-8-26-16-18-16z"/>
      <path stroke="#17171a" stroke-width="4.5" d="M-22-3H-10M-16-9V3"/>
      <circle cx="12" cy="0" r="3" fill="#17171a" stroke="#17171a" stroke-width="1.5"/>
      <circle cx="21" cy="-6" r="3" fill="#17171a" stroke="#17171a" stroke-width="1.5"/>
    </g>
    <!-- Media: disc -->
    <g transform="translate(122 122)">
      <circle r="28"/>
      <circle r="7"/>
      <path stroke-width="3.5" d="M-16-7A18 18 0 0 1-7-16M16 7A18 18 0 0 1 7 16"/>
    </g>
  </g>
</svg>
