# BackTrackarr for Portainer (Stacks -> Add stack).
#
# Use the Web editor: paste this file, and name the stack in lowercase
# (e.g. backtrackarr). Not Repository: Portainer then expects stack.env to be
# in the Git repo, and your keys must never go in a public repo.
#
# Settings: under "Environment variables" click "Advanced mode" and paste
# deploy/portainer/stack.env.example with your values. Portainer saves them
# as stack.env, and every line is handed to the container below, so any
# setting from docs/CONFIG.md works (including RADARR_2_URL and the like).
# PORT and BACKTRACKARR_VERSION are also used here in the stack itself.
services:
  backtrackarr:
    image: ghcr.io/drseussfreak/backtrackarr:${BACKTRACKARR_VERSION:-latest}
    container_name: backtrackarr
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - stack.env
    volumes:
      - backtrackarr-data:/data
      # Optional: a host folder for CLZ and streaming-service exports
      # (files in clz/ and streaming/<service>/ are imported automatically).
      # - /srv/backtrackarr/import:/data/import
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

volumes:
  backtrackarr-data:
