# BackTrackarr with Docker Compose.
#   cp .env.example .env    # then edit it
#   docker compose up -d
# To build from source instead of pulling the published image:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  backtrackarr:
    image: ghcr.io/drseussfreak/backtrackarr:latest
    container_name: backtrackarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - backtrackarr-data:/data
      # Drop CLZ and streaming-service exports here to import them automatically:
      # - ./imports:/data/import
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

volumes:
  backtrackarr-data:
