services:
  backtrackarr:
    build: .
    image: backtrackarr:latest
    container_name: backtrackarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - backtrackarr-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

volumes:
  backtrackarr-data:
