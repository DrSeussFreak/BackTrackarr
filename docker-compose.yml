services:
  backlottracker:
    build: .
    image: backlottracker:latest
    container_name: backlottracker
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - backlottracker-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

volumes:
  backlottracker-data:
